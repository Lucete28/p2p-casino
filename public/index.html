<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JMTT 카지노 · 홀덤 · 블랙잭 · 룰렛 · 슬롯</title>
  <meta name="description" content="테이블을 골라 바로 입장. 텍사스 홀덤과 블랙잭·바카라·룰렛·슬롯을 JMTT 코인으로 즐기는 카지노.">
  <link rel="canonical" href="https://justmadethisthat.com/casino/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JMTT 카지노">
  <meta property="og:title" content="JMTT 카지노 · 어느 테이블에 앉을까요?">
  <meta property="og:description" content="테이블을 골라 바로 입장. 텍사스 홀덤과 블랙잭·바카라·룰렛·슬롯을 JMTT 코인으로.">
  <meta property="og:url" content="https://justmadethisthat.com/casino/">
  <meta property="og:image" content="https://justmadethisthat.com/casino/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">
  <!-- 옛 홀덤 초대 링크(/casino/#방코드)는 홀덤으로 -->
  <script>if (/^#[A-Za-z0-9]{4,8}$/.test(location.hash)) location.replace('holdem/' + location.hash)</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="lobby.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./">JMTT CASINO</a>
    <button class="coins" id="coins" type="button" title="캐셔 열기" hidden><i class="coin-ico"></i><span class="bal-v">0</span></button>
    <a class="jmtt-google dark" id="login" href="/auth/login?next=/casino/" hidden><img src="/google-g.svg" alt="" width="18" height="18"><span class="label">Google로 로그인</span></a>
  </header>

  <div class="seat-banner" id="seat-banner" hidden></div>

  <div class="stage">
    <svg class="scene" id="scene" viewBox="-880 -330 1760 1230" role="img" aria-label="카지노 홀: 가운데 텍사스 홀덤, 왼쪽 룰렛과 바카라, 오른쪽 블랙잭과 캐셔, 뒷벽에 슬롯머신">
      <defs>
        <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="glowS" x="-20%" y="-40%" width="140%" height="180%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="a"/><feFlood flood-color="#ffc450" flood-opacity=".55"/><feComposite in2="a" operator="in" result="g"/>
          <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
        <radialGradient id="spot"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></radialGradient>
      </defs>
      <g id="world"></g>
    </svg>
  </div>

  <!-- 좁은 화면에서 누르기 쉬운 게임 목록 (lobby.js가 채움) -->
  <nav class="game-list" id="game-list" aria-label="게임 목록"></nav>

  <footer>
    <p>코인은 게임용이며 현금이나 상품으로 바꿀 수 없어요.</p>
    <a href="/">JMTT</a> · <a href="/privacy">개인정보처리방침</a> · <a href="/contact">문의</a>
  </footer>

  <dialog id="cashier">
    <small>CASHIER · 내 코인</small>
    <div class="bal" id="cashier-bal"><span class="bal-v">0</span></div>
    <p class="cashier-note" id="cashier-note">모든 게임이 같은 JMTT 코인을 써요</p>
    <!-- 파산 지원금: 코인을 모두 잃으면 1,000코인 (하루 10번). 조건은 서버가 확인 (server/core/refill.mjs) -->
    <p class="refill-note" id="refill-note" hidden></p>
    <!-- 다른 JMTT 게임에서 코인 벌기 (shared/earn.js가 채움) -->
    <p class="earn-note" id="earn-note"></p>
    <div class="cashier-actions">
      <button class="btn" id="refill" type="button" hidden>1,000코인 받기</button>
      <a class="jmtt-google dark" id="cashier-login" href="/auth/login?next=/casino/" hidden><img src="/google-g.svg" alt="" width="18" height="18">Google로 로그인</a>
      <button class="btn ghost" type="button" id="close-cashier">닫기</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <!-- JMTT 배지 (DEV_REFERENCE 1-11): 로비에만. 게임 페이지에는 넣지 않는다 -->
  <script src="/jmtt-badge.js" defer data-position="bl" data-theme="dark"></script>
  <script type="module" src="lobby.js"></script>
</body>
</html>
