<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>슬롯머신 · JMTT 카지노</title>
  <meta name="description" content="JMTT 코인으로 즐기는 3릴 5라인 클래식 슬롯머신. 레버를 당겨 777을 맞혀 보세요.">
  <link rel="canonical" href="https://justmadethisthat.com/casino/slots/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JMTT 카지노">
  <meta property="og:title" content="슬롯머신 · JMTT 카지노">
  <meta property="og:description" content="JMTT 코인으로 즐기는 3릴 5라인 클래식 슬롯머신. 레버를 당겨 777을 맞혀 보세요.">
  <meta property="og:url" content="https://justmadethisthat.com/casino/slots/">
  <meta property="og:image" content="https://justmadethisthat.com/casino/og-image.png">
  <meta property="og:locale" content="ko_KR">
  <link rel="stylesheet" href="../shared/casino.css">
  <link rel="stylesheet" href="slots.css">
</head>
<body>
  <!-- 릴 그림 (rules.mjs의 SYMBOLS와 같은 이름). display:none이면 그라데이션이 안 보여서 크기 0으로 숨김 -->
  <svg class="sl-sprite" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b5e"/><stop offset=".5" stop-color="#d8141f"/><stop offset="1" stop-color="#7c0710"/></linearGradient>
      <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b8"/><stop offset=".45" stop-color="#eec767"/><stop offset="1" stop-color="#9c7425"/></linearGradient>
      <radialGradient id="g-cherry" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff8a8a"/><stop offset=".4" stop-color="#e01b2a"/><stop offset="1" stop-color="#6d0410"/></radialGradient>
      <radialGradient id="g-lemon" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fffbd0"/><stop offset=".45" stop-color="#f7dc3b"/><stop offset="1" stop-color="#b38a0c"/></radialGradient>
      <linearGradient id="g-rind" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fbf5a"/><stop offset="1" stop-color="#1b6b2a"/></linearGradient>
      <linearGradient id="g-flesh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a6a"/><stop offset="1" stop-color="#d11d36"/></linearGradient>
    </defs>
    <symbol id="sym-seven" viewBox="0 0 100 100">
      <path d="M19 15H83V30L55 87H33L61 31H19Z" fill="url(#g-red)" stroke="url(#g-gold)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M25 20H77" stroke="#ffc9c4" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    </symbol>
    <symbol id="sym-bar" viewBox="0 0 100 100">
      <rect x="9" y="31" width="82" height="38" rx="7" fill="#141210" stroke="url(#g-gold)" stroke-width="5"/>
      <text x="50" y="59.5" text-anchor="middle" font-family="Pretendard, 'Arial Black', sans-serif" font-weight="900" font-size="27" letter-spacing="1.5" fill="url(#g-gold)">BAR</text>
    </symbol>
    <symbol id="sym-bell" viewBox="0 0 100 100">
      <circle cx="50" cy="83" r="8" fill="#9c7425"/>
      <path d="M50 12c-4 0-6.5 2.8-6.5 6.4C29 21.5 22 34 22 50v14l-9 11h74l-9-11V50c0-16-7-28.5-21.5-31.6C56.5 14.8 54 12 50 12Z" fill="url(#g-gold)" stroke="#7a5a1a" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M34 50c0-10 4-17 11-21" stroke="#fffbe6" stroke-width="4" stroke-linecap="round" fill="none" opacity=".75"/>
    </symbol>
    <symbol id="sym-melon" viewBox="0 0 100 100">
      <g transform="rotate(-12 50 50)">
        <path d="M8 34a42 42 0 0 0 84 0Z" fill="url(#g-rind)"/>
        <path d="M8 34h84" stroke="#bff3b0" stroke-width="3"/>
        <path d="M15 36a35 35 0 0 0 70 0Z" fill="url(#g-flesh)"/>
        <g fill="#2a1410"><ellipse cx="34" cy="46" rx="2.6" ry="4.2" transform="rotate(-20 34 46)"/><ellipse cx="50" cy="52" rx="2.6" ry="4.2"/><ellipse cx="66" cy="46" rx="2.6" ry="4.2" transform="rotate(20 66 46)"/><ellipse cx="42" cy="60" rx="2.4" ry="3.8" transform="rotate(-10 42 60)"/><ellipse cx="58" cy="60" rx="2.4" ry="3.8" transform="rotate(10 58 60)"/></g>
      </g>
    </symbol>
    <symbol id="sym-lemon" viewBox="0 0 100 100">
      <g transform="rotate(-24 50 50)">
        <path d="M10 50c0-3 2-5 5-5.5C20 30 34 23 50 23s30 7 35 21.5c3 .5 5 2.5 5 5.5s-2 5-5 5.5C80 70 66 77 50 77S20 70 15 55.5C12 55 10 53 10 50Z" fill="url(#g-lemon)" stroke="#9a7608" stroke-width="2"/>
        <path d="M30 38c6-5 13-7 20-7" stroke="#fffbe0" stroke-width="4" stroke-linecap="round" fill="none" opacity=".8"/>
      </g>
    </symbol>
    <symbol id="sym-cherry" viewBox="0 0 100 100">
      <path d="M33 58C38 40 48 26 62 16M66 60C64 44 63 30 62 16" stroke="#2f7d32" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M62 16c10-8 22-6 28 2-10 7-21 6-28-2Z" fill="#46a34a" stroke="#235c25" stroke-width="2"/>
      <circle cx="32" cy="70" r="17" fill="url(#g-cherry)"/>
      <circle cx="67" cy="72" r="17" fill="url(#g-cherry)"/>
      <circle cx="26" cy="64" r="4" fill="#fff" opacity=".7"/><circle cx="61" cy="66" r="4" fill="#fff" opacity=".7"/>
    </symbol>
  </svg>

  <main class="sl">
    <div class="sl-machine">
      <section class="sl-cabinet" aria-label="슬롯머신">
        <header class="sl-marquee">
          <div class="sl-bulbs" aria-hidden="true"></div>
          <div class="sl-logo"><span class="sl-logo-7">7</span><span class="sl-logo-7">7</span><span class="sl-logo-7">7</span><b>JMTT SLOTS</b></div>
          <div class="sl-bulbs" aria-hidden="true"></div>
          <button type="button" class="sl-sound" id="sound" aria-pressed="true" aria-label="소리 끄기"></button>
        </header>

        <div class="sl-glass">
          <div class="sl-window">
            <div class="sl-reels" id="reels"></div>
            <svg class="sl-paylines" id="paylines" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div class="sl-fxtext" id="fxText" aria-hidden="true"></div>
          </div>
        </div>

        <div class="sl-result" id="result" aria-live="polite">
          <div class="sl-result-main">
            <b class="sl-result-title" id="resTitle">레버를 당겨 보세요</b>
            <b class="sl-result-amt" id="resAmt"></b>
          </div>
          <p class="sl-result-sub" id="resSub">같은 그림 3개가 한 줄로 서면 당첨!</p>
        </div>

        <div class="sl-bet">
          <span class="sl-bet-label">베팅</span>
          <div class="sl-step">
            <button type="button" id="betDown" aria-label="베팅 줄이기">−</button>
            <output id="bet" aria-live="polite">5</output>
            <button type="button" id="betUp" aria-label="베팅 늘리기">+</button>
          </div>
          <span class="sl-bet-hint" id="betHint">줄 5개 모두</span>
        </div>

        <div class="sl-actions">
          <button type="button" class="sl-small" id="auto" aria-pressed="false">자동</button>
          <button type="button" class="sl-spin" id="spin">SPIN</button>
          <button type="button" class="sl-small" id="help">배당표</button>
        </div>
      </section>

      <div class="sl-lever" id="lever" role="button" tabindex="-1" aria-label="레버 당기기">
        <div class="sl-lever-track">
          <div class="sl-lever-rod" id="leverRod"></div>
          <div class="sl-lever-knob" id="leverKnob"></div>
        </div>
        <div class="sl-lever-base"></div>
        <span class="sl-lever-tip" id="leverTip" aria-hidden="true">당겨요!</span>
      </div>
    </div>

    <section class="sl-pay" aria-labelledby="payTitle">
      <h2 id="payTitle">배당표 <small id="payFor"></small></h2>
      <div class="sl-paytable" data-paytable></div>
    </section>
  </main>

  <!-- 하는 법 + 배당표. 처음 들어오면 한 번 자동으로 열림 -->
  <dialog class="casino-dialog sl-help" id="helpDlg" aria-labelledby="helpTitle">
    <h2 id="helpTitle">슬롯머신 하는 법</h2>
    <ol class="sl-howto">
      <li><b>칩 바꾸기</b><span>코인을 칩으로 바꿔요. 남은 칩은 나갈 때 코인으로 돌아와요.</span></li>
      <li><b>베팅 고르기</b><span>− + 로 한 번에 걸 칩을 골라요.</span></li>
      <li><b>레버 당기기</b><span>오른쪽 레버를 아래로 당기거나 SPIN을 눌러요.</span></li>
    </ol>
    <h3>이러면 당첨 <small id="helpFor"></small></h3>
    <div class="sl-paytable" data-paytable></div>
    <div class="row"><button class="casino-btn" type="button" id="helpOk">시작하기</button></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
