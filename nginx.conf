server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare 터널 뒤라서 리다이렉트 주소에 컨테이너의 호스트·포트가 붙지 않게 상대 주소로 보냄
    absolute_redirect off;

    # /casino 로 오면 /casino/ 로 (끝의 / 가 없으면 상대 경로인 app.js 등이 엉뚱한 곳을 가리킴)
    location = /casino {
        return 301 /casino/;
    }

    location /casino/ {
        try_files $uri $uri/ =404;
        # Cloudflare가 옛 파일을 캐시하지 않게 (홈서버 README 규칙과 같음)
        add_header Cache-Control "no-store" always;
    }

    # 로컬 확인용: 루트로 오면 게임으로
    location = / {
        return 302 /casino/;
    }
}
